<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กฎหมายแห่งเมือง พุทธศักราช ๒๕๗๕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- สารบัญด้านซ้าย -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <button class="menu-btn">&#9776;</button>
            <div class="logo-circle">
                <span>เมือง</span>
                <span>วนารัตน์</span>
            </div>
        </div>

        <div class="sidebar-title">
            <h1>กฎหมายแห่งเมือง</h1>
            <p>พุทธศักราช ๒๕๗๕</p>
        </div>

        <ul class="nav-list" id="navList">
            <!-- รายการสารบัญจะถูกสร้างผ่าน script.js -->
        </ul>
    </aside>

    <!-- พื้นที่แสดงเอกสาร -->
    <main class="main-content">
        <div class="top-bar">
            <span>ราชกิจจานุเบกษาแห่งเมือง วนารัตน์</span>
            <span id="pageIndicator">หน้า ๑ / ๖</span>
        </div>

        <div class="paper-container">
            <div class="paper-header">
                <span>เมือง วนารัตน์</span>
                <span>กฎหมายแห่งเมือง พ.ศ. ๒๕๗๕</span>
            </div>

            <div class="paper-title">
                <h2 id="docChapter">หมวดที่ ๑</h2>
                <h3 id="docTitle">บททั่วไป</h3>
            </div>

            <div id="docBody">
                <!-- เนื้อหาจะถูกสร้างผ่าน script.js -->
            </div>

            <div class="paper-footer">
                <span>ประกาศโดยพระบัญชาแห่งเมือง วนารัตน์</span>
                <span id="docPageNum">— 1 —</span>
            </div>
        </div>

        <div class="controls">
            <div class="btn-group">
                <button class="page-btn" id="prevBtn">&lt; หน้าก่อน</button>
                <button class="page-btn" id="nextBtn">หน้าถัดไป &gt;</button>
            </div>
            <p class="hint-text">ใช้ปุ่มด้านล่าง, สารบัญด้านซ้าย หรือกด &larr; / &rarr; บนแป้นพิมพ์เพื่อพลิกหน้า</p>
        </div>
        
    </main>

    <script src="script.js"></script>
</body>
</html>
